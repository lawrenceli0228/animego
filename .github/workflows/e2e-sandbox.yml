name: E2E Sandbox (Playwright + docker compose)

# The write-path suite — everything under e2e/specs/sandbox/**: auth
# journeys, /library, /player, and the local-library ↔ server watch
# progress sync. Unlike .github/workflows/e2e.yml, which points the
# read-only specs at live prod, this one boots the PR's OWN code and
# writes to a database that is destroyed with the job.
#
# ─── Why this file was worth writing ────────────────────────────────────
#
# There used to be an e2e-sandbox.yml. It was deleted in 6a28ca0, and it
# could never have worked: it never set E2E_SANDBOX, and e2e/globalSetup.ts
# returns immediately without it, so no storageState was ever minted and
# every sandbox spec would have failed on a missing ./.auth/user.json. It
# also required an ENV_PRODUCTION repository secret and merged a
# docker-compose.ci.yml that overrode two services (`app`, `mongodb`)
# which no longer exist — `docker compose config` had been failing outright
# with "service app has neither an image nor a build context specified".
#
# So for the whole life of the sandbox suite, nothing in CI ran it. This
# workflow fixes the three things that kept it broken: E2E_SANDBOX is set,
# no secret is required, and the compose overlay describes only services
# that exist.
#
# ─── Shape of the stack ─────────────────────────────────────────────────
#
#   postgres + go-api   docker compose (base + the CI overlay)
#   next-app            `next dev` on the runner itself, NOT the image
#   nginx, ws-server    not started
#
# next-app runs from source rather than the prod image for one hard
# reason: `next.config.ts:26` returns no /api rewrites under
# NODE_ENV=production, because in prod nginx owns that hop. Build the
# image and browser-side /api/* calls hit Next and 404. `next dev` keeps
# the rewrite to http://localhost:8080, which is why the CI overlay
# publishes go-api's port. Running from source is also the point of the
# exercise — the image would only prove that a Dockerfile builds.
#
# nginx is skipped because it bind-mounts nginx/selfsigned.{crt,key},
# which are not in a checkout, and nothing in the sandbox suite tests
# nginx routing. ws-server is skipped because no sandbox spec opens a
# socket — player.spec.ts explicitly filters socket.io/websocket console
# noise out of its assertions.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# One run per branch in flight; a newer push supersedes an in-flight run.
# This suite is the most expensive one in the repo — never run two.
concurrency:
  group: e2e-sandbox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-sandbox:
    name: Playwright against a PR-local stack
    runs-on: ubuntu-latest
    # Measured shape of a cold run: ~3 min building the Postgres image
    # (pg_cron is compiled from source), ~3 min building go-api, ~2 min of
    # bun/playwright installs, ~2 min for `next dev` to boot and compile
    # the warmed routes, then the suite itself. 14 specs over 3 workers on
    # a dev-mode server, with `retries: 1` on CI able to replay the slow
    # ones, lands around 8 min. 30 leaves headroom for a cold Docker layer
    # cache without letting a hung container burn a full hour.
    timeout-minutes: 30
    env:
      # Both compose files, once. The --env-file flag is still passed
      # explicitly on every call rather than via COMPOSE_ENV_FILES: a
      # bare `docker compose` reads no env file at all and interpolates
      # ${POSTGRES_PASSWORD} to the empty string, which surfaces three
      # layers down as go-api dying on a 28P01 auth failure. That footgun
      # has already cost this project one prod outage; it stays visible.
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned (not `latest`) so a Bun release can't silently flip the
          # gate. Same pin as unit-tests.yml.
          bun-version: "1.3.11"

      - name: Mint throwaway credentials
        # This job requires NO repository secret, by design. Everything
        # .env.production supplies that the sandbox actually needs is a
        # shared secret between two containers that both die with the job,
        # so it can be generated here. That is what makes this workflow
        # runnable from a fork PR and keeps it from rotting behind a
        # secret nobody remembers rotating (the deleted version needed an
        # ENV_PRODUCTION secret and that is part of why it was deleted).
        #
        # JWT_SECRET has to be identical in go-api (which signs) and in
        # `next dev` (proxy.ts:149 and the /library + /admin layouts
        # verify), so it is exported to the job env as well as written to
        # the file. Everything else go-api reads from .env.production is
        # optional: unset ANILIST_TOKEN / DANDANPLAY_* just means
        # unauthenticated upstream calls, and the CI overlay pins the
        # Gmail credentials empty so forgot-password uses NoopSender.
        run: |
          set -euo pipefail
          POSTGRES_PASSWORD="$(openssl rand -hex 16)"
          JWT_SECRET="$(openssl rand -hex 32)"
          JWT_REFRESH_SECRET="$(openssl rand -hex 32)"
          # Public repo: keep the generated values out of the job log even
          # though they are worthless outside this runner.
          echo "::add-mask::$POSTGRES_PASSWORD"
          echo "::add-mask::$JWT_SECRET"
          echo "::add-mask::$JWT_REFRESH_SECRET"
          cat > .env.production <<EOF
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          JWT_SECRET=$JWT_SECRET
          JWT_REFRESH_SECRET=$JWT_REFRESH_SECRET
          EOF
          chmod 600 .env.production
          {
            echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD"
            echo "JWT_SECRET=$JWT_SECRET"
          } >> "$GITHUB_ENV"

      - name: Build images (postgres, go-api)
        # Scoped to the two services this job runs. A bare `build` would
        # also build next-app, which takes minutes and produces an image
        # nothing here starts.
        run: docker compose --env-file .env.production build postgres go-api

      - name: Start Postgres
        run: docker compose --env-file .env.production up -d --wait --wait-timeout 120 postgres

      - name: Apply migrations
        # MUST land before go-api starts. go-api boots a River queue that
        # crash-loops against an empty schema (no river_job table), and
        # there is no other schema-apply path — go-api/cmd/migrate is an
        # empty directory and the migrations are not embedded in the
        # server binary. The `migrate` service is behind a compose profile
        # precisely so it never runs implicitly.
        run: docker compose --env-file .env.production --profile migrate run --rm migrate

      - name: Start go-api
        run: docker compose --env-file .env.production up -d --wait --wait-timeout 120 go-api

      - name: Install next-app deps
        working-directory: next-app
        run: bun install --frozen-lockfile

      - name: Start next dev
        working-directory: next-app
        env:
          # RSC server-side fetches go straight to go-api. In compose this
          # is http://go-api:8080 over the Docker network; here the Next
          # process is on the host, so it takes the published port.
          GO_API_INTERNAL_URL: http://localhost:8080
        run: |
          bun run dev > /tmp/next-dev.log 2>&1 &
          echo $! > /tmp/next-dev.pid

      - name: Wait for next dev and warm the routes
        # Two separate jobs in one step.
        #
        # Waiting: /api/healthz is next-app's own route handler (the only
        # one it has), so it answers without touching go-api and is a true
        # "the Next server process is listening" probe. Everything else
        # under /api/* falls through the dev rewrite to go-api.
        #
        # Warming: `next dev` compiles each route on first request, and a
        # cold compile can outrun Playwright's 30s navigationTimeout — a
        # timeout that would read as a product bug, not a dev-server
        # artifact. Paying that cost here, serially, keeps it out of the
        # specs.
        #
        # The retry is not defensive padding, it is a measured behaviour:
        # Turbopack prints "Ready" and answers /api/healthz before the module
        # graph has settled, and a burst of page requests in that window comes
        # back 500 with NOTHING logged. Seconds later the identical URLs return
        # 200. Warming without the retry would therefore pass while leaving the
        # app half-cold, and Playwright would inherit the tail of that window as
        # a flake nobody could reproduce.
        #
        # ─── Why each route now declares the status it must answer ──────────
        #
        # This list used to be bare paths judged by one shared rule: anything
        # that was not 5xx counted as "compiled". That rule waved through the
        # exact signal it was standing next to.
        #
        # Measured 2026-08-29, on two PRs whose diffs do not overlap (#127,
        # #128). Both failed their first attempt with the SAME nine specs at
        # the SAME line numbers, and both went green on a re-run with no code
        # change. In the failed runs, every route with a dynamic segment nested
        # inside `[lang]` answered 404 for the whole run — `[lang]/anime/[id]`,
        # `[lang]/reset-password/[token]`, `[lang]/u/[username]`,
        # `[lang]/seasonal/[season]/[year]`. Three-segment paths went 0 for 19.
        # Routes where `[lang]` is the only dynamic segment kept working.
        #
        # `/reset-password/warmup` is the canary. That page calls no API and has
        # no notFound() path, so a 404 there is impossible in a healthy stack.
        # Across 14 historical runs the line `warmed /reset-password/warmup ->
        # 404` appeared three times, and all three attempts failed. It was
        # printed, in the log, both times — and skipped, because 404 is not 5xx.
        #
        # So every route names its expected status. Two things follow that the
        # old rule could not express:
        #
        #   - `/library` and `/admin` assert 307. Nothing checked those before;
        #     if the auth redirect broke and they started answering 200, the
        #     warm-up would have called it compiled and moved on.
        #   - `/anime/0` asserts 404, and is NOT diagnostic on its own. It
        #     answers 404 in the healthy state too (the page bails on
        #     `anilistId <= 0`). The positive probe for that route class is in
        #     e2e/globalSetup.ts, which asserts `/anime/21` AFTER seeding it.
        #
        # One concept, not two: keep asking until the route answers what it
        # should, then assert. Retrying only on 5xx and asserting separately
        # would fail the job on a transient 404 that a second request would
        # have resolved. The cost of unifying them is bounded — a genuinely
        # wrong status burns 10 attempts on the FIRST route that mismatches and
        # then exits, so the job still fails around a minute in rather than
        # letting the suite run for three and report nine confusing specs.
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/api/healthz > /dev/null; then
              echo "next dev is listening after ${i}s"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "next dev did not come up in 60s"
              cat /tmp/next-dev.log
              exit 1
            fi
            sleep 1
          done
          # /anime/0 is here to compile the `[lang]/anime/[id]` segment, which
          # nothing else in this list reaches. Turbopack compiles a segment on
          # its first request, so without this the first /anime/<id> in the
          # whole suite pays for it — inside a spec's own timeout, under three
          # workers' load.
          #
          # The id is 0 rather than the routing fixture's 21 ON PURPOSE. Both
          # `generateMetadata` and the page bail on `anilistId <= 0` BEFORE
          # calling loadDetail, so 0 compiles the route and makes no API call
          # at all. Warming a real id here would be actively harmful: this step
          # runs before globalSetup seeds anything, so the miss would be a
          # genuine 404 — and `loadDetail` fetches with `revalidate: 60`, so
          # Next would serve that 404 back for a minute after the row existed.
          #
          # /seasonal/spring/2026 is the OTHER nested-dynamic segment the suite
          # reaches, and unlike /anime/0 it is diagnostic: 200 is the answer
          # only in the healthy state. It needs no seed and no clock. The page
          # builds its heading from the route params alone and swallows its own
          # API failure (`.catch(() => EMPTY_ITEMS)` in
          # [lang]/seasonal/[season]/[year]/page.tsx), so it answers 200 with an
          # empty grid against a database that has nothing in it — measured
          # against a dev server with go-api not running at all. The year is a
          # literal because parseSeasonYear bounds it to 1990..2100 and nothing
          # else, so this probe cannot go stale.
          for probe in /:200 /login:200 /register:200 /forgot-password:200 \
                       /reset-password/warmup:200 /welcome:200 /library:307 \
                       /player:200 /admin:307 /anime/0:404 \
                       /seasonal/spring/2026:200; do
            # Split on the LAST colon, so a path that ever contains one still
            # pairs correctly with its status.
            route="${probe%:*}"
            want="${probe##*:}"
            code=000
            for attempt in $(seq 1 10); do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 120 "http://localhost:3000${route}")
              [ "$code" = "$want" ] && break
              # Nudge the watcher before retrying, from the third attempt on -
              # two clean tries first, so an ordinary slow boot is unaffected.
              #
              # The dev-server defect this loop documents is a segment under
              # [lang] that never gets compiled: the router answers 404 without
              # building it, and plain retries never change that because
              # nothing has told Turbopack the tree is dirty. Restamping the
              # page files does tell it, and that is the whole remedy -- no
              # content changes, and a run that was going to pass is not
              # affected because it has already broken out of this loop.
              #
              # A few dozen utimes calls against a tree already in page
              # cache, and only from attempt 3, so the cost lands on runs that
              # are failing anyway.
              if [ "$attempt" -ge 3 ]; then
                find next-app/src/app -name 'page.tsx' -o -name 'layout.tsx' \
                  | xargs -r touch || true
              fi
              sleep 3
            done
            echo "warmed ${route} -> ${code} (want ${want}, attempt ${attempt})"
            if [ "$code" != "$want" ]; then
              echo "::error::${route} answered ${code}, expected ${want}"
              # The dev-server hint only when it applies. This loop also guards
              # auth redirects, and pointing an auth regression at a bundler bug
              # would replace one misleading failure with another.
              #
              # It names two causes rather than asserting one. The first draft
              # asserted the dev-server defect, and a deliberate product break
              # (a season removed from VALID_SEASONS) then got told to go read
              # about bundlers. A guard that confidently misattributes is the
              # thing this whole step exists to stop.
              if [ "$code" = "404" ]; then
                echo "::error::A 404 here is one of two things: (1) the dev-server defect documented above this loop, where every route with a dynamic segment under [lang] stops resolving for the whole run, or (2) a real product regression on this route. The dev log below does NOT tell them apart — measured 2026-09-06: the '○ Compiling <segment>' line is not always emitted even for routes that compile and work; the first attempt is not reliably near-zero (a defective run produced a 650ms first 404); and repeat hits collapse to ~100ms for a genuine product 404 (/anime/0) just as they do for a segment that never built. Every log-shape rule tried so far has a counter-example. What settles it in under a minute: check out this commit, run 'npx next dev' locally and request the same route. The seasonal page swallows API failures, so no backend is needed. Resolves locally => (1). 404s locally => (2), and you have a reproduction."
              fi
              cat /tmp/next-dev.log
              exit 1
            fi
          done

      - name: Install e2e deps
        working-directory: e2e
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: e2e
        run: bun run install:browsers

      - name: Run sandbox suite
        working-directory: e2e
        env:
          # The three things the suite cannot infer.
          #   E2E_SANDBOX          — opts globalSetup in AT ALL. Without it
          #                          globalSetup returns at line 1 and every
          #                          spec dies on a missing storageState.
          #                          `bun run test:sandbox` sets it too; it
          #                          is repeated here so the requirement is
          #                          visible at the call site rather than
          #                          buried in a package script.
          #   E2E_SANDBOX_BASE_URL — the host-side `next dev` server.
          #   POSTGRES_PASSWORD    — e2e/fixtures/pg.ts refuses to guess a
          #                          password (a hard-coded fallback in a
          #                          public repo is a leak waiting to
          #                          happen), so it must be handed one.
          E2E_SANDBOX: "1"
          E2E_SANDBOX_BASE_URL: http://localhost:3000
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          CI: "true"
        # KNOWN RESIDUAL FLAKE — do not "fix" it by widening the console
        # noise filter in e2e/specs/_helpers.ts.
        #
        # library-autorescan.spec.ts asserts an empty console, and running
        # against `next dev` means React's DEVELOPMENT build is doing the
        # logging. Under three parallel workers on a cold server it can emit
        #   "Can't perform a React state update on a component that hasn't
        #    mounted yet…"
        # from the watch-folder rescan path. Observed once in five full local
        # runs; `retries: 1` (CI-only, playwright.config.ts) absorbed it, and
        # four runs were clean. The prod React build would not print it at
        # all, so suppressing it would trade a visible flake for a permanently
        # blind assertion. If it turns into a regular failure, that is signal
        # about the rescan effect, not about this workflow.
        run: bun run test:sandbox

      - name: Dump service logs on failure
        if: failure()
        # The report artifact shows what Playwright saw from the browser.
        # These are the two other windows on the same failure, and they are
        # gone the moment the runner is reclaimed. `docker compose logs`
        # after a container is recreated shows nothing, which is how a
        # previous prod post-mortem lost its evidence — grab them here.
        # The tails are 4000, not 200, because 200 could not reach the
        # failure. go-api emits a steady stream of background enrichment
        # logs, so by the time this step runs the last 200 lines are all
        # from after the suite finished — the requests that actually failed
        # have scrolled off. A post-mortem that has to be repeated because
        # the evidence step captured the wrong window costs more than the
        # log lines do.
        run: |
          echo "───── next dev ─────"
          tail -4000 /tmp/next-dev.log || true
          echo "───── containers ─────"
          docker compose --env-file .env.production logs --tail=4000 || true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-sandbox
          path: e2e/playwright-report/
          retention-days: 14

      - name: Tear down
        if: always()
        # -v is safe and wanted here: the volumes belong to this job's
        # compose project on an ephemeral runner, and a fresh database is
        # what makes the next run reproducible.
        run: |
          kill "$(cat /tmp/next-dev.pid)" 2>/dev/null || true
          docker compose --env-file .env.production down -v || true
