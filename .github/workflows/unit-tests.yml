name: Unit Tests

# Gates the per-service unit suites that were previously ungated (and had
# silently rotted). One job per service, all run in parallel:
#   - go-api    : `go test ./...` — table-driven + testcontainers(Postgres).
#                 GitHub-hosted ubuntu runners ship Docker, so the PG-backed
#                 packages (admin/comments/social/subscriptions/danmaku/
#                 dandanplay/bgmidmap) spin their own container and run for real.
#   - next-app  : `bun test` (bun:test) — proxy gate, server actions, lib utils.
#   - ws-server : `jest` — socket auth, danmaku handler, connection lifecycle.
#   - next-app-build : `next build` + `tsc --noEmit` + lint ratchet + an
#                 assertion that /anime/[id] is still statically prerendered.
#
# This is the safety net that keeps the suites GREEN. E2E (live prod) and
# Lighthouse live in sibling workflows; this one is the fast unit gate.
on:
  pull_request:
    branches: [main, feat/go-backend]
  push:
    branches: [main, feat/go-backend]
  workflow_dispatch:

# One run per branch in flight; a newer push supersedes an in-flight run.
concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-api:
    name: go-api (go test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go-api/go.mod
          cache-dependency-path: go-api/go.sum

      - name: Build
        working-directory: go-api
        run: go build ./...

      # The Postgres-backed packages (admin/comments/social/subscriptions/
      # danmaku/dandanplay/bgmidmap) use testcontainers with a CUSTOM image
      # — postgres:16-alpine + pg_cron compiled from source (the schema does
      # `CREATE EXTENSION pg_cron`, so stock postgres won't apply it). That
      # image only exists as a local tag, so build it here; otherwise
      # testcontainers tries to PULL `animego-postgres:dev` and the run fails
      # with "pull access denied". ubuntu-latest ships Docker, so this just works.
      - name: Build test Postgres image (animego-postgres:dev — pg_cron)
        run: docker build -t animego-postgres:dev go-api/docker/postgres

      - name: Test
        working-directory: go-api
        run: go test ./... -count=1

      # `go test ./...` above does not compile files behind a build tag, so
      # everything under test/integration was invisible to CI. It rotted
      # accordingly: by 2026-08-21 the package had not compiled since
      # migration 0011 added bgm_match_source in June, because the V12DB test
      # double was never updated for that signature or for the four methods
      # the description sweep added afterwards. A whole suite -- the migration
      # tests, the pg_cron TTL test, the queue dispatch smoke tests -- was
      # silently absent from every PR for two months.
      #
      # vet is a separate step from test on purpose. It fails on a compile
      # break in about a second and names the file, whereas the test run only
      # reports it after paying ~40s of container startup.
      - name: Vet integration tests (compile gate)
        working-directory: go-api
        run: go vet -tags=integration ./test/integration/...

      # Spins Postgres 16 (the custom pg_cron image built above) and Mongo 7
      # via testcontainers. TestMain starts each once and shares them across
      # the package, so this costs container startup, not per-test startup.
      - name: Integration tests (testcontainers)
        working-directory: go-api
        run: go test -tags=integration -count=1 -timeout=600s ./test/integration/...

  next-app:
    name: next-app (bun test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned (not `latest`) so a Bun release can't silently flip the gate.
          bun-version: "1.3.11"

      - name: Install
        working-directory: next-app
        run: bun install --frozen-lockfile

      - name: Test
        working-directory: next-app
        run: bun test

  # Nothing in CI compiled the frontend until now: a branch that imported a
  # module that does not exist could pass all five checks, and one did — the
  # break was found by hand with `git ls-tree`, after merge.
  #
  # Step order is deliberate and build comes first, even though a type error
  # then costs a full build to surface. Next 16 generates typed-route
  # definitions into `.next/types/`, which `tsconfig.json` pulls in via its
  # `include`. Typechecking before the build would silently skip them and
  # report green on a broken route reference.
  next-app-build:
    name: next-app (build + types + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned to match the sibling job — see its comment.
          bun-version: "1.3.11"

      - name: Install
        working-directory: next-app
        run: bun install --frozen-lockfile

      # No Go API is reachable from a runner, and that is fine: every
      # `generateStaticParams` catches its fetch failure and returns [], so the
      # build prerenders zero pages and still exits 0. It compiles every route,
      # which is the point. Do not "fix" this by standing up a backend —
      # the zero-page path is what the ISR assertion below is written against.
      - name: Build
        working-directory: next-app
        run: bun run build

      - name: Typecheck
        working-directory: next-app
        run: bunx tsc --noEmit

      - name: Lint (ratchet)
        run: node scripts/ci/eslint-ratchet.mjs

      - name: Assert /anime/[id] is still prerendered
        run: node scripts/ci/assert-isr.mjs

  ws-server:
    name: ws-server (jest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ws-server/package-lock.json

      - name: Install
        working-directory: ws-server
        run: npm ci

      - name: Test
        working-directory: ws-server
        run: npm test
