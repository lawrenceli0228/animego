name: E2E (Playwright)

# v1 (P10 Lane B) runs the public read-only suite against live prod.
#
# Why prod and not a docker-compose stack?
#   - .env.production is gitignored and holds secrets the CI runner
#     cannot reconstruct; spinning up the local stack would require
#     vaulting the env or rebuilding it from GitHub Secrets, which is
#     out of scope for v1.
#   - All v1 specs are READ-ONLY (no writes, no auth, no library, no
#     player, no admin). Pointing at live prod is safe and exercises
#     the actual SSR / ISR / CDN path users hit.
#   - The v2 write-path specs (auth, library, player) DO need a sandbox
#     stack. That workflow now exists: .github/workflows/e2e-sandbox.yml
#     boots Postgres + go-api from docker compose and runs `next dev` on
#     the runner, so nothing there touches prod data.
# A change that touches only prose skips the run (the `paths` rule is
# explained in unit-tests.yml).
#
# It also runs on every push to main, for one reason beyond a post-merge
# smoke test of prod: GitHub Actions caches are scoped to a branch and its
# base, so the Playwright cache a PR saves is invisible to the next PR. A
# cache saved on main is visible to all of them. Without this, each new
# PR's first sandbox run missed it and fetched the fonts from a mirror that
# has taken nearly ten minutes.
on:
  pull_request:
    branches: [main, feat/go-backend]
    paths: ["**", "!**/*.md", "!docs/**", "DESIGN.md"]
  push:
    branches: [main]
    paths: ["**", "!**/*.md", "!docs/**", "DESIGN.md"]
  workflow_dispatch:

# Only one suite per branch in flight — duplicate runs against live
# prod add no signal and double the artifact bill.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright against live prod
    # Pinned, not `ubuntu-latest`. GitHub rolled `ubuntu-latest` to Ubuntu
    # 26.04 between 2026-10-23 and 2026-10-29, and the pinned Playwright
    # (1.60.0, held by e2e/bun.lock) refuses to install a browser there:
    #   ERROR: Playwright does not support chromium on ubuntu26.04-x64
    # That took out this job and all six sandbox shards on every PR, with no
    # code change behind it. Revisit when Playwright supports 26.04 -- the
    # upgrade is its own change, because it moves the browser version under
    # the layout specs.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      # The browser and the system packages `--with-deps` adds. Their apt
      # download once took 8.5 min and timed this job out — see
      # e2e/scripts/ci-install-playwright.sh. Same key as e2e-sandbox.yml.
      - name: Restore Playwright browser and packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/playwright-debs
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/bun.lock') }}

      - name: Install e2e deps and Playwright Chromium
        working-directory: e2e
        run: bash scripts/ci-install-playwright.sh

      - name: Run Playwright (prod project only)
        working-directory: e2e
        env:
          E2E_BASE_URL: https://animegoclub.com
          CI: "true"
        # --project=chromium-prod skips the chromium-sandbox project,
        # which boots Postgres + go-api + `next dev` and writes to them.
        # That one runs in .github/workflows/e2e-sandbox.yml.
        run: bun run test:prod

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
