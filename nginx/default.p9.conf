# ═══════════════════════════════════════════════════════════════════════
# P9 CUTOVER CONFIG — flips the API + WebSocket data plane onto the Go stack.
#
# Identical to nginx/default.conf (P8.1 routing) EXCEPT:
#   - go_api upstream is ENABLED (was commented out in default.conf).
#   - location /api/        proxy_pass  http://app  ->  http://go_api
#   - location /socket.io/  proxy_pass  http://app  ->  http://ws_server
# Every next-app location, the maintenance error_page, timeouts, SSL, and
# security headers are byte-for-byte the same as default.conf.
#
# Apply at cutover (T+0):
#   cp nginx/default.p9.conf nginx/default.conf
#   docker compose restart nginx
# (restart, NOT reload: git pull swaps the bind-mounted file's inode, and
#  nginx -s reload keeps reading the old inode — only a full container
#  restart re-opens the new file.)
#
# Rollback: restore default.conf from git + docker compose restart nginx.
#
# Behaviour checks: scripts/nginx-test/run.sh starts this file in the real
# nginx image beside stand-in upstreams and checks routing, the image caches
# and the AniList mirror.  CI runs it on every pull request.
# ═══════════════════════════════════════════════════════════════════════

# Upstream names are re-resolved at runtime, not once at nginx start.  A
# container that restarts comes back on a new IP; with the address fixed at
# start-up, requests keep going to the old one until nginx itself restarts.
# 127.0.0.11 is Docker's embedded DNS; `resolve` on each upstream server
# needs the shared-memory `zone` beside it.
resolver 127.0.0.11 valid=10s ipv6=off;

# Image-optimizer output is cached here (location /_next/image below).  The
# CDN caches these responses too, but only through the cache rule that
# scripts/cf-image-cache-rule.sh adds, and only per edge location, so every
# edge's first request for a variant still lands here.  Without this cache
# each of those is another encode.  Sized to hold every variant the site's
# pages ask for, so an encode happens about once a month per variant rather
# than whenever the cache is full: at 1g it was full, and evicting, while a
# scraper walked the catalogue.  keys_zone holds about 8k keys per megabyte;
# the directory is a volume (nginx-cache in docker-compose.yml).
proxy_cache_path /var/cache/nginx/next_image levels=1:2 keys_zone=next_image:48m
                 max_size=8g inactive=30d use_temp_path=off;

# The optimizer picks AVIF or WebP from the Accept header, so the cache key
# carries the format it would pick rather than the raw header (browsers send
# many different Accept strings for the same three outcomes).
map $http_accept $next_image_fmt {
    default        orig;
    "~image/avif"  avif;
    "~image/webp"  webp;
}

# The one query string the site's pages produce for an image: next/image's
# loader writes url, w and q, in that order, in lower case, and nothing else
# (it would add dpl only if a deploymentId were configured; none is).  Any
# other shape is refused before it reaches the cache or the optimizer, and
# that is what makes it safe to build the cache key from $args
# ($next_image_key_args below).  A key built from $arg_url is not safe: nginx
# matches argument names case-insensitively and takes the first one, while
# Next reads only the lower-case url, so ?URL=a&url=b would file the image
# for b under the key for a, for everyone who asks for a.
# The regex is case-sensitive (~, not ~*).
map $args $next_image_args_ok {
    default 0;
    "~^url=[^&]+&w=[0-9]+&q=[0-9]+$" 1;
}

# The /_next/image cache key: the query string, with one rewrite.  An AniList
# image addressed through our mirror (https://animegoclub.com/img/anilist/
# <path>, see the mirror section in the main server) is filed under the query
# string its AniList address would have (https://s4.anilist.co/file/
# anilistcdn/<path>), with the same w and q.  The mirror serves AniList's
# bytes unchanged, so both addresses encode to the same variant, and when the
# pages move from one address to the other every variant is already there.
# Every other request -- the AniList address itself, site images, video
# stills -- keeps exactly the key it had before this map existed, so the
# entries already in next_image stay valid.
#
# The rewrite is safe only because $next_image_args_ok has already held the
# query string to url=<one value>&w=<n>&q=<n>: the capture then carries that
# one url's path and the same w and q, and there is no second url for nginx
# and Next to read differently.  The regex is case-sensitive; a mirror
# address encoded any other way is simply not rewritten and gets an entry of
# its own.
map $args $next_image_key_args {
    default $args;
    "~^url=https%3A%2F%2Fanimegoclub\.com%2Fimg%2Fanilist%2F(?<next_image_mirror_rest>.+)$"
        "url=https%3A%2F%2Fs4.anilist.co%2Ffile%2Fanilistcdn%2F$next_image_mirror_rest";
}

# Original AniList images, byte for byte as AniList serves them (the mirror
# section in the main server and the warm server at the end of this file).
# Unlike next_image, this is not a cache of something we can make again from
# a source we hold: once AniList is down or refusing us, an entry is our only
# copy.  So nothing ages out for lack of use (inactive is ten years), and
# max_size is a ceiling for the worst case, well above what the images the
# database references take, not a working-set size; evicting by size would
# quietly hand those images back to AniList.  keys_zone holds about 8k keys
# per megabyte.  The directory is on the same nginx-cache volume.
proxy_cache_path /var/cache/nginx/anilist_orig levels=1:2 keys_zone=anilist_orig:48m
                 max_size=30g inactive=3650d use_temp_path=off;

# Rules that must not be public -- a fingerprint of traffic being refused is
# no use once whoever sends it can read it here -- live in nginx/private/ on
# the server, which git ignores and docker-compose.yml mounts.  http-*.conf
# files are included here, next-image-*.conf files inside location
# /_next/image.  A pattern that matches nothing includes nothing.
include /etc/nginx/private/http-*.conf;

# next-app upstream. After the P11 cutover + legacy retirement, EVERY
# user-facing route is served by next-app (see the location blocks below).
# The old Express `app` upstream is gone.
upstream next_app {
    zone next_app 64k;
    server next-app:3000 resolve;
}

# The image optimizer: the same Next build, run as a container of its own
# (next-image in docker-compose.yml) so that encoding has a CPU ceiling
# separate from page rendering.  max_conns bounds how many requests are in
# flight there at once, counted across workers because of the zone; it is a
# memory bound, not the CPU one (that is the container's `cpus`).  Only what
# the cache cannot answer reaches an upstream -- a miss, or the one request
# that refreshes an expired entry -- so an image already in next_image is
# never turned away by it.
#
# Past the limit nginx has no queue (that is nginx Plus): the request gets a
# 503 at once, and an image that fails does not retry, so the card stays
# blank.  Below it, requests wait inside next-image while the CPU works
# through them, and arrive late instead.  So the limit is set for waiting:
# well above a page's burst (the characters tab alone renders 48 mostly cold
# portraits) and above the bursts a scraper sends.  At 64, scraper bursts
# held every slot for tens of seconds at a time, and real readers' new images
# in those windows came back 503.
upstream next_image_app {
    zone next_image_app 64k;
    server next-image:3000 resolve max_conns=256;
}

# AniList's image CDN, for the original-image mirror.  It is a CDN, so its
# addresses change; `resolve` keeps following them through the resolver at
# the top of this file, which hands names outside the compose network on to
# the host's DNS.
upstream anilist_cdn {
    zone anilist_cdn 64k;
    server s4.anilist.co:443 resolve;
}

# P2.8: ws-server upstream (socket.io danmaku). Defined now so the P9
# cutover only needs to flip the /socket.io/ proxy_pass below from
# `http://app` to `http://ws_server`. The container is healthy already
# (see docker-compose.yml ws-server service); it just isn't on the
# request path yet.
upstream ws_server {
    zone ws_server 64k;
    server ws-server:3001 resolve;
}

# P9 cutover: go-api upstream ENABLED. /api/ proxy_pass below switches
# from http://app to http://go_api. PORT_GO=8080 (docker-compose.yml
# go-api service; config.go envInt("PORT_GO", 8080)).
upstream go_api {
    zone go_api 64k;
    server go-api:8080 resolve;
}

server {
    listen 80;
    server_name animegoclub.com;
    return 301 https://$host$request_uri;
}

# www -> root: keep all backlinks pointed at the canonical apex domain.
server {
    listen 80;
    server_name www.animegoclub.com;
    return 301 https://animegoclub.com$request_uri;
}

server {
    listen 443 ssl;
    server_name www.animegoclub.com;

    ssl_certificate /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key;

    return 301 https://animegoclub.com$request_uri;
}

server {
    listen 443 ssl;
    # `localhost` lets the same conf work for local `docker compose up`
    # smoke testing; the self-signed cert's SAN covers it.
    server_name animegoclub.com localhost;

    ssl_certificate /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key;

    # Cloudflare real IP
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header CF-Connecting-IP;

    # ───────────────────────────────────────────────────────────────
    # P8.1 Day-1 Fix: server-level upstream defaults + maintenance page
    #
    # Timeouts:
    #   nginx ships 60s defaults for proxy_*_timeout. That's too generous
    #   when next-app is hung — clients wait a full minute for nginx to
    #   give up before the maintenance page kicks in. 5s connect / 30s
    #   read is plenty for SSR.
    #
    # Overrides:
    #   /socket.io/ — re-sets proxy_read_timeout to 86400 (24h, long-poll
    #                 + persistent WebSocket frames).
    #   /api/       — explicit proxy_read_timeout 30 (already matches
    #                 server default; kept for clarity).
    #
    # Fallback:
    #   error_page maps 502/503/504 to /maintenance.html with a forced
    #   503 status, but only the next_app locations flip
    #   proxy_intercept_errors to on. /api/ and /socket.io/ keep
    #   pass-through so RSC fetches and socket clients see real 5xx
    #   codes and handle them themselves instead of getting an HTML
    #   maintenance body where they expected JSON / a WS frame.
    # ───────────────────────────────────────────────────────────────
    proxy_connect_timeout 5s;
    proxy_send_timeout 10s;
    proxy_read_timeout 30s;

    error_page 502 503 504 =503 /maintenance.html;
    location = /maintenance.html {
        internal;
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
        # Don't let CF / browsers cache the maintenance body, otherwise
        # users see the 503 page long after next-app is healthy again.
    }

    # ───────────────────────────────────────────────────────────────
    # P8.1 partial cutover: routing precedence
    #
    # nginx location matching priority (highest first):
    #   1. `=  /path`      exact match
    #   2. `^~ /prefix/`   prefix-no-regex (stops processing)
    #   3. `~  /regex/`    regex match
    #   4. `   /prefix/`   longest prefix match
    #
    # Strategy:
    #   - WebSocket and /api/ keep going to legacy Express. Phase 8.5
    #     flips /api/ to go_api once that service ships.
    #   - The public SEO surface (root, /anime/, /seasonal/, /search,
    #     /welcome, /sitemap.xml, /robots.txt) and Next's own asset path
    #     (/_next/) go to next-app.
    #   - Everything else (login, register, library, player, admin,
    #     profile, calendar, faq, /u/, /forgot-password, etc.) falls
    #     through to the catch-all `location /` -> legacy Express.
    # ───────────────────────────────────────────────────────────────

    # P9: WebSocket (socket.io danmaku) now -> ws-server (was http://app).
    location /socket.io/ {
        proxy_pass http://ws_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # P9: API proxy now -> go-api (was http://app). next-app's RSC fetches
    # go directly to go-api:8080 via Docker DNS (GO_API_INTERNAL_URL),
    # NOT through this nginx path.
    location /api/ {
        proxy_pass http://go_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30;
    }

    # ─── next-app routes ──────────────────────────────────────────────

    # Shared next-app proxy block — buffering off so RSC streaming /
    # loading.tsx Suspense boundaries flush chunks to the client as Next
    # produces them, instead of nginx holding the whole response.
    # Without this, every next-app page waits for the full SSR pass
    # before the first byte reaches the browser.
    #
    # next-app sends its own Cache-Control headers (Next 16 standalone).
    # Only the image optimizer is cached in nginx (next_image, below);
    # every other next-app response passes through uncached.

    # Image optimizer.  Served by next-image (upstream next_image_app above),
    # never by next_app, and cached in next_image (see proxy_cache_path at the
    # top) so each variant is encoded once: proxy_cache_lock lets the first
    # request fill an entry while the rest wait for it, and a stale entry is
    # served while next-image is down or busy, or while one request refreshes
    # it.  Vary, Cache-Control and Expires from upstream are ignored because
    # the key already carries the negotiated format and the entry's lifetime
    # is set here.  Set-Cookie is NOT ignored: a response that sets a cookie
    # is never cached.
    #
    # No proxy_cache_background_update: the background refresh keeps the
    # client connection busy until it finishes, and the CDN's connections to
    # this origin are shared by many visitors, so a page request could queue
    # behind a re-encode.
    #
    # The key is the query string, which $next_image_args_ok (top of the file)
    # has already held to the one shape the pages produce, with an AniList
    # image's mirror address filed under its AniList address
    # ($next_image_key_args, also at the top).
    location /_next/image {
        if ($next_image_args_ok = 0) {
            return 400;
        }
        include /etc/nginx/private/next-image-*.conf;
        proxy_pass http://next_image_app;
        # Requests queue in next-image while a burst drains (see max_conns on
        # the upstream), so they get longer than the server-wide 30s.
        proxy_read_timeout 60s;
        proxy_intercept_errors on;
        # Past max_conns there is no upstream left to try, which nginx reports
        # as a 502.  For an image that means "busy", not the maintenance page.
        error_page 502 504 =503 @next_image_busy;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering on;
        proxy_cache next_image;
        proxy_cache_key "$next_image_key_args|$next_image_fmt";
        proxy_ignore_headers Vary Cache-Control Expires;
        proxy_cache_valid 200 30d;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 30s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        # No add_header here: a location that declares any add_header stops
        # inheriting the server-level security headers below.
    }

    # The CDN has a cache rule for /_next/image; a "busy" answer must never be
    # what it keeps for that image.
    location @next_image_busy {
        add_header Cache-Control "no-store" always;
        return 503;
    }

    # ─── AniList original-image mirror ───────────────────────────────
    #
    # Pages that use the mirror address for an AniList image ask the
    # optimizer for https://animegoclub.com/img/anilist/<path>, so it takes
    # the original from this server instead of from AniList, and an image
    # stored here keeps showing while AniList is slow, down, or refusing us.
    #
    #  reader ─► CDN ─► /_next/image ─(variant not cached)─► next-image
    #                                                           │
    #           fetches https://animegoclub.com/img/anilist/<path>
    #                                                           ▼
    #                  CDN ─► /img/anilist/<path>   public, read-only
    #                           ├─ stored, fresh ──► the stored original
    #                           ├─ not stored ─────► AniList's answer,
    #                           │                    which is not stored
    #                           └─ stored, expired ► revalidated with AniList;
    #                                                if AniList fails or
    #                                                refuses, the stored one
    #
    #  go-api warm job (hourly; only images the database references)
    #    └─► nginx:8090 /warm/<path>   internal, not published
    #          └─► AniList ─► 200 stored in anilist_orig; AniList's status
    #                         goes back to the job unchanged
    #
    # <path> is what follows /file/anilistcdn/ in an AniList image address.
    # Both entry points accept the same allowlist of paths and file each
    # original under the path alone, so an image the warm job stored is what
    # /img/anilist/ serves.  A path outside the allowlist is a 404 that never
    # reaches AniList.
    #
    # /img/anilist/ reads anilist_orig and never adds to it (proxy_no_cache):
    # an image no one has stored is fetched from AniList for that one request
    # and not kept.  Only the warm server stores, and only our own job calls
    # it, so nothing a visitor asks for can make this server keep an image.
    # (When AniList confirms an expired entry with 304 Not Modified, nginx
    # renews that entry here; that keeps bytes already stored and never adds
    # new ones.)
    #
    # ^~ keeps every regex location elsewhere in this server away from these
    # requests.  The nested regex is the allowlist: anime and manga covers and
    # banners, character and staff portraits -- every kind of AniList image
    # the database references -- each with a plain file name and an image
    # extension.  The rest of AniList's CDN (user uploads, for one) falls to
    # the 404 at the end of the block without contacting AniList.  The regex
    # sees the URI after nginx has decoded it and resolved dot segments, and
    # only what it captures is sent to AniList, so encoded slashes or dots,
    # or a query string, never get there.
    location ^~ /img/anilist/ {
        location ~ "^/img/anilist/(?<anilist_path>(media/(anime|manga)/(cover/(large|medium|extraLarge|small)|banner)|character/(large|medium)|staff/(large|medium))/[A-Za-z0-9_.-]+\.(jpe?g|png|gif|webp))$" {
            # Anything but GET (and HEAD) would be relayed to AniList, body
            # and all.
            limit_except GET { deny all; }

            proxy_pass https://anilist_cdn/file/anilistcdn/$anilist_path;
            # TLS to AniList, checked against the system CA bundle under
            # AniList's own name (the upstream group's name is not a host
            # name).  The depth allows up to three intermediate CAs: nginx's
            # default allows one, and some CDN certificates are issued
            # through two.
            proxy_ssl_server_name on;
            proxy_ssl_name s4.anilist.co;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 3;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            # Nothing from the visitor's request is passed on: not their
            # cookies or address, and not Accept or Accept-Encoding, which
            # could get a different format or encoding from AniList than the
            # one stored for everyone under the bare path.
            proxy_pass_request_headers off;
            proxy_set_header Host s4.anilist.co;
            proxy_set_header User-Agent "animegoclub-image-mirror (+https://animegoclub.com)";
            # AniList's headers do not decide what is stored: only a 200 is
            # kept, for as long as proxy_cache_valid says, whatever
            # Cache-Control, Expires, Vary, Set-Cookie or X-Accel-* say.
            # (Honouring X-Accel-* would also let the upstream redirect the
            # request inside this server.)  Headers that would act on our own
            # site in a browser -- a cookie, an HSTS policy, an error-report
            # endpoint -- are not passed on.
            proxy_ignore_headers Cache-Control Expires Vary Set-Cookie
                                 X-Accel-Expires X-Accel-Redirect X-Accel-Limit-Rate
                                 X-Accel-Buffering X-Accel-Charset;
            proxy_hide_header Set-Cookie;
            proxy_hide_header Strict-Transport-Security;
            proxy_hide_header Report-To;
            proxy_hide_header NEL;
            # How long the CDN in front of us may keep an answer is decided
            # here, not by AniList.  An original keeps for 30 days.  An error
            # keeps nowhere: AniList's errors can say to cache them for a
            # month (its 404s do), and a refusal kept by the CDN would go on
            # hiding an image long after AniList had stopped refusing.
            # expires sets Cache-Control on success answers only and, unlike
            # add_header, leaves the server's security headers in place.
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            expires 30d;

            proxy_cache anilist_orig;
            proxy_cache_key $anilist_path;
            proxy_cache_valid 200 30d;
            proxy_cache_revalidate on;
            proxy_no_cache 1;
            # An expired original is served while AniList fails, and also
            # while it refuses us (403, 429), which is the case the mirror
            # exists for.
            proxy_cache_use_stale error timeout updating
                                  http_500 http_502 http_503 http_504 http_403 http_429;
            # No proxy_cache_lock.  A lock only helps when the request holding
            # it stores what it fetched, and here none does: other requests
            # for the same unstored image would queue behind it, one at a
            # time and for up to the 5s lock timeout, and then fetch it
            # anyway.
            error_page 502 504 @anilist_unavailable;
            # No add_header here (see /_next/image).
        }
        return 404;
    }

    # nginx itself got no answer from AniList for an image it could not serve
    # from anilist_orig.  That is not the site being down, so not the
    # maintenance page, and the CDN must not keep it.
    location @anilist_unavailable {
        add_header Cache-Control "no-store" always;
        return 502;
    }

    # Next.js static asset bundle. Longest-prefix match beats catch-all.
    location /_next/ {
        proxy_pass http://next_app;
        proxy_intercept_errors on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Static, hash-named, immutable. Next ships its own
        # Cache-Control: public, max-age=31536000, immutable header.
        proxy_buffering on;
    }

    # Root (HomePage) - exact match overrides the catch-all `location /`.
    location = / {
        proxy_pass http://next_app;
        proxy_intercept_errors on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # SEO entry-points - exact paths.
    location = /sitemap.xml {
        proxy_pass http://next_app;
        proxy_intercept_errors on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /robots.txt {
        proxy_pass http://next_app;
        proxy_intercept_errors on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /search - exact + query-string variants (nginx strips the query
    # before matching, so this catches /search?q=...). No trailing
    # slash; legacy has no /search/ sub-routes.
    location = /search {
        proxy_pass http://next_app;
        proxy_intercept_errors on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # Anime detail pages /anime/:id - prefix-no-regex match. Beats
    # any later prefix or catch-all.
    location ^~ /anime/ {
        proxy_pass http://next_app;
        proxy_intercept_errors on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # Seasonal /seasonal/:season/:year.
    #
    # `^~ /seasonal/` (prefix-no-regex, requires trailing slash in URI)
    # alone caused a redirect loop: bare /seasonal fell through to
    # `location /` -> Express, which had no /seasonal route but the
    # `^~ /seasonal/` block's presence makes nginx emit an implicit 301
    # "add trailing slash" for the bare form. Then next-app's default
    # trailingSlash=false 308'd /seasonal/ back to /seasonal → infinite.
    #
    # Fix: route both forms (bare + trailing-slash) at next-app, which
    # owns the canonical /seasonal index page (redirects to the current
    # season). The exact-match block also outranks the implicit
    # add-slash behaviour because `=` has the highest priority.
    location = /seasonal {
        proxy_pass http://next_app;
        proxy_intercept_errors on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
    location ^~ /seasonal/ {
        proxy_pass http://next_app;
        proxy_intercept_errors on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # Admin (P7): /admin overview + /admin/enrichment + /admin/users.
    # next-app/src/proxy.ts gates this surface server-side: reads the
    # `session` cookie, verifies the JWT, 403s if role !== 'admin', and
    # 302s to /login otherwise. layout.tsx re-checks the role as
    # belt-and-suspenders. Bare `/admin` and `/admin/anything` both
    # land on next-app via this prefix.
    location ^~ /admin {
        proxy_pass http://next_app;
        proxy_intercept_errors on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # Library + Player (P6): /library, /library/:seriesId, /player.
    # Same proxy.ts gate as /admin but without the role check — any
    # valid session can use the local library / player. layout.tsx
    # in both routes re-runs the cookie check as belt-and-suspenders.
    # Dexie + jassub + artplayer all live in 'use client' subtrees
    # behind dynamic({ssr:false}); the next-app container only serves
    # the shell + WASM assets, the heavy lifting happens in the
    # browser.
    location ^~ /library {
        proxy_pass http://next_app;
        proxy_intercept_errors on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
    location ^~ /player {
        proxy_pass http://next_app;
        proxy_intercept_errors on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # P9 — full auth surface ported to next-app. EXACT match for
    # /login, /register, /forgot-password; prefix match for
    # /reset-password/ since it carries a dynamic [token] segment.
    # Legacy /login-suffix / /register-suffix / /forgot-password-suffix
    # URLs (none today, but defensive) stay on Express via the catch-all.
    #
    # Trailing-slash forms 301 to the canonical bare path — without
    # this `/login/` etc. would fall through to the catch-all and hit
    # the legacy Express container, which has no such route and would
    # either 404 or render the old SPA shell.
    location = /login/ {
        return 301 /login;
    }
    location = /register/ {
        return 301 /register;
    }
    location = /forgot-password/ {
        return 301 /forgot-password;
    }
    location = /login {
        proxy_pass http://next_app;
        proxy_intercept_errors on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
    location = /register {
        proxy_pass http://next_app;
        proxy_intercept_errors on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
    location = /forgot-password {
        proxy_pass http://next_app;
        proxy_intercept_errors on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
    # Bare /reset-password (no token) is non-functional regardless of
    # backend — the page needs a [token] segment. Return 404 at the
    # nginx layer instead of letting it fall through to legacy Express,
    # which has no route for it either but would serve the SPA shell.
    location = /reset-password {
        return 404;
    }
    # /reset-password/<token> — prefix match because the token is a
    # dynamic Next.js segment. nginx never inspects the token; it just
    # forwards the path to next-app which resolves params.
    location ^~ /reset-password/ {
        proxy_pass http://next_app;
        proxy_intercept_errors on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # /jassub/* is the WASM asset path under next-app/public/jassub/.
    # Routed through Next so its standard cache headers apply.
    # nginx-level caching could be tightened post-deploy.
    location ^~ /jassub/ {
        proxy_pass http://next_app;
        proxy_intercept_errors on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Welcome / marketing page. EXACT match (no `^~ /welcome` prefix —
    # that would catch /welcomeXYZ /welcome2 /welcome-anything and route
    # them to next-app, breaking any future legacy URL with /welcome*
    # prefix. next-app has no /welcome/ sub-routes anyway.
    location = /welcome {
        proxy_pass http://next_app;
        proxy_intercept_errors on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # /about (legacy URL, still receives external backlinks pointing at
    # the old marketing page) -> 301 to /welcome so search engines
    # consolidate link equity onto the canonical next-app route. Without
    # this, /about (legacy SPA) and /welcome (next-app RSC) are two
    # different URLs with the same content -> duplicate-content penalty.
    location = /about {
        return 301 /welcome;
    }

    # ─── P11 — profile / social / calendar / faq / season ────────────
    # These were the last legacy-SPA routes. P11 ported them to
    # next-app, so route them to next_app instead of letting them fall
    # through to the (now route-less) Express catch-all, which would 404
    # or serve a stale SPA shell. /profile rides the proxy.ts auth gate;
    # /u/* is public (OptionalAuth); /season 308-redirects to the live
    # /seasonal/<s>/<y> via next.config redirects().
    location ^~ /profile {
        proxy_pass http://next_app;
        proxy_intercept_errors on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
    location ^~ /u/ {
        proxy_pass http://next_app;
        proxy_intercept_errors on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
    location ^~ /calendar {
        proxy_pass http://next_app;
        proxy_intercept_errors on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
    location ^~ /faq {
        proxy_pass http://next_app;
        proxy_intercept_errors on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
    location = /season {
        proxy_pass http://next_app;
        proxy_intercept_errors on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # ─── Catch-all -> next-app ───────────────────────────────────────
    # After P11 every user-facing route is on next-app; this catch-all
    # now serves next-app too (legacy Express `app` retired). next-app
    # renders its own 404 for any genuinely unknown path.
    location / {
        proxy_pass http://next_app;
        proxy_intercept_errors on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    # No Cross-Origin-Opener-Policy / Cross-Origin-Embedder-Policy, on purpose.
    #
    # They were here so /player and /library got SharedArrayBuffer for jassub.
    # Two things turned out to be false.  jassub 2.5 does not need SAB: its
    # emscripten loader sizes the pthread pool to zero when the page is not
    # cross-origin isolated and renders single-threaded (measured 2026-09-12:
    # `ready` in 147ms without the headers, ASS painted).  And a per-route map
    # cannot scope them: COOP/COEP are document-level, and Next's client-side
    # navigation never fetches a new document, so a visitor who clicks from
    # the home page into /anime/<id> carries the home page's isolation with
    # them and the YouTube trailer iframe is blocked (ERR_BLOCKED_BY_RESPONSE).
    # Only a hard load of the detail route ever saw the per-route exemption.
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # script-src directives explained:
    #   'wasm-unsafe-eval' — jassub WebAssembly.compile / .instantiate (player)
    #   'unsafe-eval'      — emscripten `new Function(args, body)` for WASM
    #                        invoker trampolines inside jassub-worker.js;
    #                        without it renderer.ready never resolves
    #   'unsafe-inline'    — Next.js 16 streaming SSR emits inline
    #                        hydration bootstrap + Suspense flush scripts
    #                        that have no stable hash and cannot be
    #                        externalized. Without this, RSC hydrate fails
    #                        and the entire React tree unmounts to fallback.
    #                        Long-term fix: nonce-based CSP via next-app
    #                        middleware.ts (deferred to pre-P9 hardening).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' https://static.cloudflareinsights.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; media-src 'self' blob:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' blob: wss://$host https://cloudflareinsights.com https://*.ingest.us.sentry.io; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self';" always;
    # Allow same-origin local-fonts permission (jassub CJK fallback via
    # navigator.queryLocalFonts). Default policy would have denied it.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), local-fonts=(self)" always;
}

# ─── AniList mirror: the warm entry point ─────────────────────────────
# The only place that stores originals in anilist_orig (see the mirror
# diagram in the server above).  The go-api warm job calls
#     GET http://nginx:8090/warm/<path>
# for images the database references, and acts on the status:
#     200            stored now, revalidated, or already stored and fresh
#     anything else  nothing is stored.  AniList's own answer is passed on
#                    unchanged (404, 429 with its Retry-After, 5xx, ...); a
#                    502 or 504 can also be nginx getting no answer at all.
# Port 8090 is not published in docker-compose.yml, so only containers on
# the compose network reach this server.  Anything but /warm/<path> with an
# allowlisted <path> is a 404 that never reaches AniList.
server {
    listen 8090;
    server_name _;

    # The same upstream timeouts as the main server.
    proxy_connect_timeout 5s;
    proxy_send_timeout 10s;
    proxy_read_timeout 30s;

    # The job keeps its own record of every image it asks for; logging each
    # request here as well would push everything else out of nginx's rotated
    # log during a first fill.
    access_log off;

    location ^~ /warm/ {
        # The same allowlist as /img/anilist/.
        location ~ "^/warm/(?<anilist_path>(media/(anime|manga)/(cover/(large|medium|extraLarge|small)|banner)|character/(large|medium)|staff/(large|medium))/[A-Za-z0-9_.-]+\.(jpe?g|png|gif|webp))$" {
            limit_except GET { deny all; }

            # The same request to AniList as /img/anilist/ (see there).
            proxy_pass https://anilist_cdn/file/anilistcdn/$anilist_path;
            proxy_ssl_server_name on;
            proxy_ssl_name s4.anilist.co;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 3;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_pass_request_headers off;
            proxy_set_header Host s4.anilist.co;
            proxy_set_header User-Agent "animegoclub-image-mirror (+https://animegoclub.com)";
            proxy_ignore_headers Cache-Control Expires Vary Set-Cookie
                                 X-Accel-Expires X-Accel-Redirect X-Accel-Limit-Rate
                                 X-Accel-Buffering X-Accel-Charset;
            proxy_hide_header Set-Cookie;
            proxy_hide_header Strict-Transport-Security;
            proxy_hide_header Report-To;
            proxy_hide_header NEL;

            proxy_cache anilist_orig;
            proxy_cache_key $anilist_path;
            proxy_cache_valid 200 30d;
            # Asking again for an original stored more than 30 days ago makes
            # nginx revalidate it with a conditional request: 304 renews the
            # stored copy, 200 replaces it.  A fresh one is answered from
            # anilist_orig without asking AniList.
            proxy_cache_revalidate on;
            # Two requests for the same new image fetch it once.
            proxy_cache_lock on;
            # No proxy_cache_use_stale, unlike /img/anilist/.  When AniList
            # fails or refuses, the job must get that answer and not the
            # stored copy, or it would carry on instead of backing off.
        }
        return 404;
    }

    location / {
        return 404;
    }
}
